apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-provider-config
  namespace: argocd
  annotations:
    # Wave 2: runs after crossplane-providers (wave 1) is Healthy, so the
    # aws.upbound.io/ProviderConfig CRD — installed dynamically by
    # provider-family-aws — exists before this manifest is applied.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitOpsRepo.url | quote }}
    targetRevision: {{ .Values.gitOpsRepo.branch | quote }}
    path: {{ printf "%s/gitops/addons/crossplane-provider-config" .Values.basePath | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.crossplane | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
