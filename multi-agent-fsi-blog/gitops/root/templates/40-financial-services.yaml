apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financial-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitOpsRepo.url | quote }}
    targetRevision: {{ .Values.gitOpsRepo.branch | quote }}
    path: {{ printf "%s/apps/financial-services/gitops/financial-services-stack" .Values.basePath | quote }}
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: terraform.git.url
          value: {{ .Values.gitOpsRepo.url | quote }}
        - name: terraform.git.branch
          value: {{ .Values.gitOpsRepo.branch | quote }}
        - name: terraform.path
          value: {{ printf "./%s/apps/financial-services/terraform/financial-services-components" .Values.basePath | quote }}
        # Remote S3 backend for the Flux Terraform CR (see
        # apps/financial-services/gitops/.../templates/terraform-resource.yaml).
        # Empty -> Tofu Controller falls back to the Kubernetes Secret
        # backend, which is flake-prone under runner Pod restarts.
        - name: terraform.s3Backend.bucket
          value: {{ .Values.terraform.s3Backend.bucket | quote }}
        - name: terraform.s3Backend.lockTable
          value: {{ .Values.terraform.s3Backend.lockTable | quote }}
        # EKS OIDC values for Agent Gateway jwtAuthentication. Empty strings
        # mean the gateway-policies template skips authn/authz rendering.
        - name: eks.oidcIssuer
          value: {{ .Values.eks.oidcIssuer | quote }}
        - name: eks.jwksJson
          value: {{ .Values.eks.jwksJson | quote }}
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.financialServices | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
