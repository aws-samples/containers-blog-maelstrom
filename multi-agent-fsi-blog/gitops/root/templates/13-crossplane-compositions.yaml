apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-compositions
  namespace: argocd
  annotations:
    # Wave 3: runs after crossplane-providers (wave 1) and
    # crossplane-provider-config (wave 2). XRDs need only the
    # apiextensions.crossplane.io CRDs (installed by crossplane-core at
    # wave 0) to be applied. The Composition's resources[].base is
    # RawExtension — the underlying Memory/Browser/CodeInterpreter CRDs
    # only need to exist when an XR instantiates them.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitOpsRepo.url | quote }}
    targetRevision: {{ .Values.gitOpsRepo.branch | quote }}
    path: {{ printf "%s/gitops/addons/crossplane-compositions" .Values.basePath | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.crossplane | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
