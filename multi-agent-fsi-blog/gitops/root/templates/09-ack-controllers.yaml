{{- /*
Self-managed AWS Controllers for Kubernetes (ACK).

The AWS-managed ACK EKS Capability ships an older bedrockagentcorecontrol
build that does not reconcile the Browser kind (and lags on the newest
AgentCore resources). To get full parity with the previous Crossplane setup —
Memory, Browser, and CodeInterpreter — we self-manage the ACK controllers via
ArgoCD instead, pulling the published controller charts from public ECR.

One Application per service controller (bedrockagentcorecontrol, iam, eks),
all at sync-wave 0 so their CRDs + controllers are up before the AgentCore
RGDs (wave 1) and the financial-services chart (wave 4). Each controller's
ServiceAccount is bound to an IAM role via EKS Pod Identity in
terraform/cluster/ack_capability_iam.tf (namespace ack-system).
*/ -}}
{{- $waves := dict "bedrockagentcorecontrol" "0" "iam" "0" "eks" "0" }}
{{- $versions := dict "bedrockagentcorecontrol" "1.10.0" "iam" "1.5.0" "eks" "1.10.0" }}
{{- range $svc, $ver := $versions }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-{{ $svc }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/aws-controllers-k8s
    chart: {{ $svc }}-chart
    targetRevision: {{ $ver | quote }}
    helm:
      releaseName: ack-{{ $svc }}
      values: |
        aws:
          region: {{ $.Values.ack.region }}
        serviceAccount:
          create: true
          name: ack-{{ $svc }}-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.namespaces.ackSystem | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
{{- end }}
