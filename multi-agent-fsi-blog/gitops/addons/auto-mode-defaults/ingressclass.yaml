# EKS Auto Mode ships the AWS Load Balancer Controller managed (controller
# name: eks.amazonaws.com/alb) but does NOT create a default IngressClass.
# Any Ingress object that doesn't specify ingressClassName will be ignored
# by the controller until this exists.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
