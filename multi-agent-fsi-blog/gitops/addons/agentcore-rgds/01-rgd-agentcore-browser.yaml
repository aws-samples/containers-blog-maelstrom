# kro ResourceGraphDefinition — AgentCoreBrowser
#
# Replaces the Crossplane XRD + Composition pair for AgentCore Browser. Same
# namespaced composite kind + parameters as before; emits an ACK Browser plus a
# Secret (writeConnectionSecretName) carrying status.id under key `id`
# (consumed by the agent Deployment as BROWSER_ID).
#
# Note: the Secret is emitted by kro directly rather than via an ACK
# FieldExport — the AWS-managed ACK EKS Capability does not install the shared
# FieldExport CRD.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agentcorebrowser.fsi.aws.example.com
spec:
  schema:
    # group defaults to kro.run if unset; pin it so the served composite kind
    # is AgentCoreBrowser.fsi.aws.example.com — the API the chart declares.
    group: fsi.aws.example.com
    apiVersion: v1alpha1
    kind: AgentCoreBrowser
    scope: Namespaced
    spec:
      region: string | required=true
      name: string | required=true
      description: string | default=""
      networkMode: string | default="PUBLIC"
      tags: "map[string]string"
      writeConnectionSecretName: string | required=true
    status:
      id: ${browser.status.id}
      arn: ${browser.status.ackResourceMetadata.arn}
  resources:
    - id: browser
      readyWhen:
        - ${browser.status.conditions.exists(c, c.type == "ACK.ResourceSynced" && c.status == "True")}
      template:
        apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
        kind: Browser
        metadata:
          name: ${schema.spec.name}
          annotations:
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: ${schema.spec.name}
          description: ${schema.spec.description}
          networkConfiguration:
            networkMode: ${schema.spec.networkMode}
          tags: ${schema.spec.tags}
    - id: idSecret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.spec.writeConnectionSecretName}
        stringData:
          id: ${browser.status.id}
