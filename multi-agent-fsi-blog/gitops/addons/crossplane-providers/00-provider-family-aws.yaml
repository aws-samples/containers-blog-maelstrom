# -----------------------------------------------------------------------------
# Upbound family provider for AWS (base)
#
# v2 family providers split authentication + shared config (this package)
# from per-service resource providers (aws-bedrockagentcore, aws-iam, aws-eks).
# Every per-service provider depends on this one for ProviderConfig.
# -----------------------------------------------------------------------------
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-aws
  annotations:
    # Wave 0: install the family provider first. Its package registers
    # the shared CRDs (ProviderConfig, ProviderConfigUsage) that every
    # child provider needs at controller startup. ArgoCD waits for this
    # Provider to report Healthy=True — which only happens after the
    # package revision is Active and the pod is Ready — before moving
    # on to the child providers in wave 1.
    argocd.argoproj.io/sync-wave: "0"
spec:
  package: xpkg.upbound.io/upbound/provider-family-aws:v2.5.3
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: aws-provider-runtime
