{{- define "fs.agentEnv" -}}
- name: AWS_REGION
  value: {{ .root.Values.awsRegion | quote }}
- name: BEDROCK_MODEL_ID
  value: {{ .root.Values.bedrockModelId | quote }}
- name: MCP_GATEWAY_URL
  value: {{ .root.Values.agentGateway.url | quote }}
- name: A2A_GATEWAY_URL
  value: {{ .root.Values.agentGateway.url | quote }}
- name: LITELLM_URL
  value: {{ .root.Values.litellm.url | quote }}
- name: LITELLM_MODEL
  value: {{ .root.Values.litellm.model | quote }}
- name: LITELLM_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .root.Values.litellm.apiKeySecret.name | quote }}
      key: {{ .root.Values.litellm.apiKeySecret.key | quote }}
      optional: true
{{- end }}

{{- define "fs.projectedToken" -}}
- name: agent-gateway-token
  projected:
    sources:
      - serviceAccountToken:
          path: token
          audience: {{ .root.Values.agentGateway.audience | quote }}
          expirationSeconds: {{ .root.Values.agentGateway.tokenExpirationSeconds }}
{{- end }}

{{- define "fs.tokenMount" -}}
- name: agent-gateway-token
  mountPath: /var/run/secrets/agent-gateway
  readOnly: true
{{- end }}

{{- $secretName := printf "financial-services-outputs-%s" .Values.version -}}

{{- range list "financial-advisor" "portfolio-analyst" "risk-assessment" "market-data" }}
{{ $agent := . -}}
{{ $sa := printf "%s-sa" $agent -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $agent }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: {{ $agent }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $agent }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $agent }}
  template:
    metadata:
      labels:
        app: {{ $agent }}
    spec:
      serviceAccountName: {{ $sa }}
      volumes:
        {{- include "fs.projectedToken" (dict "root" $) | nindent 8 }}
      containers:
        - name: agent
          {{- if eq $agent "financial-advisor" }}
          image: "{{ $.Values.images.registry }}/{{ $.Values.images.financialAdvisor.repository }}:{{ $.Values.images.financialAdvisor.tag }}"
          {{- else if eq $agent "portfolio-analyst" }}
          image: "{{ $.Values.images.registry }}/{{ $.Values.images.portfolioAnalyst.repository }}:{{ $.Values.images.portfolioAnalyst.tag }}"
          {{- else if eq $agent "risk-assessment" }}
          image: "{{ $.Values.images.registry }}/{{ $.Values.images.riskAssessment.repository }}:{{ $.Values.images.riskAssessment.tag }}"
          {{- else if eq $agent "market-data" }}
          image: "{{ $.Values.images.registry }}/{{ $.Values.images.marketData.repository }}:{{ $.Values.images.marketData.tag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            {{- include "fs.agentEnv" (dict "root" $) | nindent 12 }}
            {{- if eq $agent "financial-advisor" }}
            - name: MEMORY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: memory_id
                  optional: true
            {{- else if eq $agent "portfolio-analyst" }}
            - name: CODE_INTERPRETER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: code_interpreter_id
                  optional: true
            {{- else if eq $agent "risk-assessment" }}
            - name: CODE_INTERPRETER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: code_interpreter_id
                  optional: true
            {{- else if eq $agent "market-data" }}
            - name: BROWSER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: browser_id
                  optional: true
            {{- end }}
          volumeMounts:
            {{- include "fs.tokenMount" (dict "root" $) | nindent 12 }}
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
{{- end }}
