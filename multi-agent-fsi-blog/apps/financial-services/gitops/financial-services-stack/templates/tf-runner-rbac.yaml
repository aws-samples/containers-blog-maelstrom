# Bind the tofu-controller's tf-runner-role ClusterRole (installed by the
# tofu-controller Helm chart) to the tf-runner ServiceAccount in the
# financial-services namespace. Without this, the runner Pod gets 403
# on the `secrets` API when trying to read the mutual-TLS cert that
# tf-controller generates per-namespace.
#
# The default tf-runner-rolebinding ClusterRoleBinding only targets
# flux-system/tf-runner, so we add a second binding for every namespace
# that hosts a Terraform CR.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tf-runner-{{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tf-runner-role
subjects:
  - kind: ServiceAccount
    name: tf-runner
    namespace: {{ .Values.namespace }}
