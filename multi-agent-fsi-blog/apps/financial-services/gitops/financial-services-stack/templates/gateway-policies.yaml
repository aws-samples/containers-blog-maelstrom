# ----------------------------------------------------------------------------
# Agent Gateway v2.2.0-main CRD note
#
# The v1alpha1 AgentgatewayPolicy CRD only exposes:
#   spec.frontend:  accessLog | http | tcp | tls | tracing
#   spec.backend:   ai | auth | http | mcp | tcp | tls | traffic
#   spec.targetRefs, spec.targetSelectors, spec.traffic
#
# Fine-grained per-ServiceAccount MCP tool authz and per-agent A2A authz
# (the patterns documented for future Agent Gateway releases) aren't
# expressible on this CRD revision. Tracing (configured by the cluster-wide
# tracing-policy in gitops/addons/agent-gateway-config/) is the one policy
# that works today. Revisit once agentgateway.dev ships authz primitives.
#
# All ServiceAccounts in the financial-services namespace can reach /mcp and
# /agents/* routes via the gateway. Workload-level auth remains: each agent
# pod still mounts a projected SA token, and the target services can
# validate the caller identity from the Authorization header.
# ----------------------------------------------------------------------------
