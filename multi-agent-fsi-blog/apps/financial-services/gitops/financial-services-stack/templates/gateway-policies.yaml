{{- if and .Values.eks.oidcIssuer .Values.eks.jwksJson -}}
{{- $ns := .Values.namespace -}}
{{- $audience := .Values.agentGateway.audience -}}
{{- $gwName := .Values.agentGateway.gatewayName -}}
{{- $gwNs := .Values.agentGateway.gatewayNamespace -}}
{{- $advisorSub := printf "system:serviceaccount:%s:financial-advisor-sa" $ns -}}
{{- $portfolioSub := printf "system:serviceaccount:%s:portfolio-analyst-sa" $ns -}}
{{- $riskSub := printf "system:serviceaccount:%s:risk-assessment-sa" $ns -}}
{{- $marketSub := printf "system:serviceaccount:%s:market-data-sa" $ns -}}

# ----------------------------------------------------------------------------
# 1. Gateway-level JWT authentication
#
# Every request traversing agent-gateway-proxy must carry a valid EKS
# ServiceAccount token with audience "agent-gateway". The JWKS was fetched
# by terraform/bootstrap from the EKS OIDC issuer and plumbed here via
# helm.parameters on the root ArgoCD Application — no manual values edit.
#
# mode: Strict rejects requests missing or failing token validation with 401.
# ----------------------------------------------------------------------------
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: financial-services-jwt-authn
  namespace: {{ $gwNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ .Values.eks.oidcIssuer | quote }}
          audiences:
            - {{ $audience | quote }}
          jwks:
            inline: {{ .Values.eks.jwksJson | b64dec | quote }}

---
# ----------------------------------------------------------------------------
# 2. A2A authorization — only financial-advisor-sa may call specialists
#
# Attached per-HTTPRoute (one policy per specialist). The CEL expression
# matches the JWT `sub` claim against the advisor's SA identity. Rules are
# deny-by-default once any Allow rule is attached, so no explicit Deny
# policy is needed — unknown principals get 403.
# ----------------------------------------------------------------------------
{{- range list "portfolio-analyst" "risk-assessment" "market-data" }}
{{- $target := . }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $target }}-a2a-authz
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $target }}-a2a-route
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - 'jwt.sub == "{{ $advisorSub }}"'
{{- end }}

---
# ----------------------------------------------------------------------------
# 3. MCP authorization — only the three specialists may call financial-tools
#
# financial-advisor-sa is deliberately absent: the advisor delegates to
# specialists, never calls MCP tools directly. A caller presenting the
# advisor's SA token for /mcp gets 403.
# ----------------------------------------------------------------------------
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: financial-tools-mcp-authz
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: financial-tools-mcp-route
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - 'jwt.sub == "{{ $portfolioSub }}"'
          - 'jwt.sub == "{{ $riskSub }}"'
          - 'jwt.sub == "{{ $marketSub }}"'

# The `financial-advisor-a2a-route` HTTPRoute intentionally has no
# authorization policy — it is the public entry point for external callers.
# The Gateway-level jwtAuthentication still requires a valid token with
# audience=agent-gateway, so unauthenticated traffic is blocked at the edge.
{{- end }}
