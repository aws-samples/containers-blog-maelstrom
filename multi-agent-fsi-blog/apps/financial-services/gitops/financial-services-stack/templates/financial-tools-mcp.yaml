apiVersion: v1
kind: ServiceAccount
metadata:
  name: financial-tools-mcp-sa
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: financial-tools-mcp
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: financial-tools-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-tools-mcp
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-tools-mcp
  template:
    metadata:
      labels:
        app: financial-tools-mcp
    spec:
      serviceAccountName: financial-tools-mcp-sa
      containers:
        - name: mcp-server
          image: "{{ .Values.images.registry }}/{{ .Values.images.mcpServer.repository }}:{{ .Values.images.mcpServer.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
