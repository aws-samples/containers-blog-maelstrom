{{- /*
Per-agent AgentCore provisioning.

For each agent that has ANY agentcore.* toggle set, render a dedicated Flux
Terraform CR. Each CR provisions only the capabilities that agent opted
into, plus a per-agent IAM role + Pod Identity association. The CR writes
its outputs to a per-agent Secret consumed only by that agent's Deployment.

Design: per-agent CRs keep Tofu flakiness from becoming a blast radius.
A runner Pod corruption on one agent's CR doesn't prevent the other three
from reconciling. Adding or removing an agent is an edit to .Values.agents.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: financial-services-terraform-{{ .Values.version }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  interval: 1m
  url: {{ .Values.terraform.git.url }}
  ref:
    branch: {{ .Values.terraform.git.branch }}

{{- range $agent := .Values.agents }}
{{- $needsAgentCore := or $agent.agentcore.memory (or $agent.agentcore.browser $agent.agentcore.codeInterpreter) }}
{{- if $needsAgentCore }}
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: {{ printf "%s-%s-components-%s" $.Values.projectName $agent.name $.Values.version }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    fs/agent: {{ $agent.name }}
spec:
  # Longer reconcile interval than the default 1m; AgentCore Memory creation
  # alone takes ~3 min. Shorter loops racing against in-flight applies are
  # where Tofu state corruption comes from.
  interval: 10m
  retryInterval: 5m

  path: {{ $.Values.terraform.path }}
  serviceAccountName: {{ $.Values.terraform.serviceAccountName }}
  sourceRef:
    kind: GitRepository
    name: financial-services-terraform-{{ $.Values.version }}

  runnerPodTemplate:
    metadata:
      annotations:
        # On EKS Auto Mode, Karpenter consolidation will evict long-running
        # pods to pack workloads. This annotation pins the runner for the
        # full apply duration.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi

  vars:
    - name: aws_region
      value: {{ $.Values.awsRegion }}
    - name: project_name
      value: {{ printf "%s-%s" $.Values.projectName $agent.name }}
    - name: eks_cluster_name
      value: {{ $.Values.eksClusterName }}
    - name: namespace
      value: {{ $.Values.namespace }}
    - name: agent_sa
      value: {{ $agent.name }}-sa
    - name: enable_memory
      value: {{ $agent.agentcore.memory | quote }}
    - name: enable_browser
      value: {{ $agent.agentcore.browser | quote }}
    - name: enable_code_interpreter
      value: {{ $agent.agentcore.codeInterpreter | quote }}
    - name: network_mode
      value: {{ $.Values.networkMode }}

  writeOutputsToSecret:
    name: {{ printf "%s-%s-outputs-%s" $.Values.projectName $agent.name $.Values.version }}
  destroyResourcesOnDeletion: true
  approvePlan: auto
{{- end }}
{{- end }}
