apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: financial-services-terraform-{{ .Values.version }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  interval: 1m
  url: {{ .Values.terraform.git.url }}
  ref:
    branch: {{ .Values.terraform.git.branch }}
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: financial-services-components-{{ .Values.version }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Reconcile cadence. Longer than the default 1m so the legitimate ~3min
  # AgentCore provisioning time doesn't race with the next reconcile loop.
  interval: 10m
  # When an apply fails, wait before retrying — prevents thrashing through
  # conflict errors while upstream state settles.
  retryInterval: 5m

  path: {{ .Values.terraform.path }}
  serviceAccountName: {{ .Values.terraform.serviceAccountName }}
  sourceRef:
    kind: GitRepository
    name: financial-services-terraform-{{ .Values.version }}

  # Remote S3 backend tried and parked — the runner image's embedded
  # Terraform binary ships aws-sdk-go v1 without Pod Identity support,
  # so the S3 backend Init fails with NoCredentialProviders even with a
  # valid Pod Identity association. Falling back to the default
  # Kubernetes Secret backend with tunings below. Documented as a
  # known limitation in the blog post; when this fails, fallback is to
  # run `terraform apply` locally from terraform/financial-services-components
  # and kubectl-create the outputs Secret by hand.

  # Runner Pod template — the default 1Gi is too small, and Auto Mode's
  # node consolidation can evict long-running pods mid-apply.
  # Note: the Tofu Controller CRD restricts runnerPodTemplate.spec to a
  # small allowlist (affinity, env, image, resources, securityContext,
  # tolerations, volumes, etc.) — it does NOT expose
  # terminationGracePeriodSeconds.
  runnerPodTemplate:
    metadata:
      annotations:
        # Critical on EKS Auto Mode: Karpenter's consolidation will try
        # to evict long-running pods to pack workloads. This annotation
        # keeps the runner Pod alive for the entire apply.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi

  vars:
    - name: aws_region
      value: {{ .Values.awsRegion }}
    - name: project_name
      value: {{ .Values.projectName }}
    - name: eks_cluster_name
      value: {{ .Values.eksClusterName }}
    - name: namespace
      value: {{ .Values.namespace }}
    - name: network_mode
      value: {{ .Values.networkMode }}
    - name: enable_memory
      value: {{ .Values.capabilities.memory }}
    - name: enable_browser
      value: {{ .Values.capabilities.browser }}
    - name: enable_code_interpreter
      value: {{ .Values.capabilities.codeInterpreter }}

  writeOutputsToSecret:
    name: financial-services-outputs-{{ .Values.version }}
  destroyResourcesOnDeletion: true
  approvePlan: auto
