apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: financial-services-terraform-{{ .Values.version }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  interval: 1m
  url: {{ .Values.terraform.git.url }}
  ref:
    branch: {{ .Values.terraform.git.branch }}
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: financial-services-components-{{ .Values.version }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Reconcile cadence. Longer than the default 1m so the legitimate ~3min
  # AgentCore provisioning time doesn't race with the next reconcile loop.
  interval: 10m
  # When an apply fails, wait before retrying — prevents thrashing through
  # conflict errors while upstream state settles.
  retryInterval: 5m

  path: {{ .Values.terraform.path }}
  serviceAccountName: {{ .Values.terraform.serviceAccountName }}
  sourceRef:
    kind: GitRepository
    name: financial-services-terraform-{{ .Values.version }}

  # Remote S3 backend with DynamoDB locking. State survives the runner Pod
  # lifecycle, which is the single biggest flake we kept hitting: the
  # default Kubernetes backend ties state to a Secret that only gets
  # written on clean pod exit.
  {{- if .Values.terraform.s3Backend.bucket }}
  backendConfig:
    customConfiguration: |-
      terraform {
        backend "s3" {
          bucket         = "{{ .Values.terraform.s3Backend.bucket }}"
          key            = "{{ .Values.terraform.s3Backend.key }}"
          region         = "{{ .Values.awsRegion }}"
          dynamodb_table = "{{ .Values.terraform.s3Backend.lockTable }}"
          encrypt        = true
        }
      }
  {{- end }}

  # Runner Pod template — the biggest source of flakiness was the runner
  # getting SIGKILL'd mid-apply (OOMKilled at the default 1Gi, or evicted
  # by Auto Mode node consolidation). These settings give it room + time.
  runnerPodTemplate:
    metadata:
      annotations:
        # Critical on EKS Auto Mode: Karpenter's consolidation will try
        # to evict long-running pods to pack workloads. This annotation
        # keeps the runner Pod alive for the entire apply.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      # 30 minutes. terraform apply on AgentCore Memory alone takes ~3min.
      # Default is 30s which is far shorter than any real apply — if the
      # controller SIGTERMs the runner mid-apply, state corruption is
      # all but guaranteed.
      terminationGracePeriodSeconds: 1800
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi

  vars:
    - name: aws_region
      value: {{ .Values.awsRegion }}
    - name: project_name
      value: {{ .Values.projectName }}
    - name: eks_cluster_name
      value: {{ .Values.eksClusterName }}
    - name: namespace
      value: {{ .Values.namespace }}
    - name: network_mode
      value: {{ .Values.networkMode }}
    - name: enable_memory
      value: {{ .Values.capabilities.memory }}
    - name: enable_browser
      value: {{ .Values.capabilities.browser }}
    - name: enable_code_interpreter
      value: {{ .Values.capabilities.codeInterpreter }}

  writeOutputsToSecret:
    name: financial-services-outputs-{{ .Values.version }}
  destroyResourcesOnDeletion: true
  approvePlan: auto
