# Langfuse Helm values — reference only.
#
# The demo does NOT deploy Langfuse from this chart; it uses the raw manifests
# in gitops/addons/langfuse/langfuse.yaml (see gitops/root/templates/06-langfuse.yaml
# for why). This file is kept as documentation of the equivalent Helm config.
#
# No credentials are committed. All passwords/secrets are generated at deploy
# time by scripts/setup-infra.sh. If you switch to the Helm chart, wire these
# to a pre-created Secret (existingSecret) rather than inlining values here.
replicaCount: 1

ingress:
  enabled: false

postgresql:
  enabled: true
  auth:
    existingSecret: "langfuse-secrets"   # generated by setup-infra.sh

redis:
  enabled: true
  auth:
    existingSecret: "langfuse-secrets"   # generated by setup-infra.sh

clickhouse:
  enabled: true
  auth:
    existingSecret: "langfuse-secrets"   # generated by setup-infra.sh

langfuse:
  salt:
    value: ""  # Generated at install time by setup-infra.sh
  nextauth:
    secret:
      value: ""  # Generated at install time by setup-infra.sh
    url: "http://langfuse.observability:3000"

environment:
  # Enable OTLP ingestion so agents and Bifrost can send traces via OTLP
  LANGFUSE_ENABLE_OTEL_INGESTION: "true"
