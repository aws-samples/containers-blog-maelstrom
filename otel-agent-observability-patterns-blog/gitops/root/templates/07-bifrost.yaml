# Bifrost LLM Gateway — shared platform service used by both patterns.
# Routes all agent LLM calls to Bedrock. OTEL plugin creates child spans
# correlated with agent traces via W3C traceparent.
#
# Bifrost is infrastructure, not an agent: it is a shared gateway that holds
# the only Bedrock credentials in the system. It therefore lives in the
# observability (shared platform) namespace alongside Langfuse and the OTEL
# Collector, not in the agents namespace. Agents reach it at
# http://bifrost.observability:8080.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bifrost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    chart: bifrost
    repoURL: https://maximhq.github.io/bifrost/helm-charts
    targetRevision: "2.*"
    helm:
      releaseName: bifrost
      valuesObject:
        image:
          tag: "v1.6.10"
        serviceAccount:
          create: true
          name: bifrost
        env:
          - name: AWS_REGION
            value: "{{ .Values.region }}"
        config:
          enforceAuthOnInference: false
        plugins:
          otel:
            enabled: true
            version: 1
            config:
              service_name: "bifrost"
              # Pattern 1: direct to Langfuse. Pattern 2: override to otel-collector.observability:4317
              collector_url: "{{ .Values.bifrost.otelTarget }}"
              trace_type: "genai_extension"
              protocol: "{{ .Values.bifrost.otelProtocol }}"
              insecure: true
          governance:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.observability }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
