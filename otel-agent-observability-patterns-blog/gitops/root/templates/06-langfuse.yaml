# Langfuse v3 — deployed as raw manifests from gitops/addons/langfuse/
# Using direct manifests instead of the community Helm chart because the chart
# has a broken S3 secret reference that prevents OTLP ingestion from working.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: {{ .Values.gitops.basePath }}/gitops/addons/langfuse
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.observability }}
  # The Langfuse credential Secrets (langfuse-secrets, langfuse-init-keys,
  # langfuse-api-keys) are intentionally NOT part of this GitOps source. They
  # are generated with random values by scripts/setup-infra.sh before sync.
  # Keeping them out of git is what prevents ArgoCD self-heal from reverting the
  # generated credentials (ignoreDifferences alone does not stop self-heal from
  # re-applying the manifest's desired state).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
