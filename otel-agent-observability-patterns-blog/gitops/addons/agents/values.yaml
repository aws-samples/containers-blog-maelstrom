clusterName: agent-observability
region: us-west-2

# Each agent demonstrates a different observability pattern:
#   research-agent → Pattern 1 (Decentralized): direct to Langfuse
#   data-agent     → Pattern 2 (Centralized): via OTEL Collector to Langfuse
agents:
  - name: research-agent
    module: research_agent
    image: 257077212816.dkr.ecr.us-west-2.amazonaws.com/otel-agents/research-agent:9e5bfbd
    port: 8080
    pattern: decentralized
    capabilities:
      memory: false
      browser: false
      codeInterpreter: false

  - name: data-agent
    module: data_agent
    image: 257077212816.dkr.ecr.us-west-2.amazonaws.com/otel-agents/data-agent:9e5bfbd
    port: 8080
    pattern: centralized
    capabilities:
      memory: false
      browser: false
      codeInterpreter: false
