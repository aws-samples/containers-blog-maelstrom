clusterName: agent-observability
region: us-west-2

# Bedrock model configuration (update when models change)
bedrockPrimaryModel: us.anthropic.claude-sonnet-4-6-20260514
bedrockFallbackModel: us.anthropic.claude-haiku-4-5-20260514

# IMPORTANT: Image refs are updated by scripts/setup-agents.sh after build.
# If you see ImagePullBackOff, run: ./scripts/setup-agents.sh
agents:
  - name: research-agent
    module: research_agent
    image: "257077212816.dkr.ecr.us-west-2.amazonaws.com/otel-agents/research-agent:a45a406"
    port: 8080
    capabilities:
      memory: false
      browser: false
      codeInterpreter: false

  - name: data-agent
    module: data_agent
    image: "257077212816.dkr.ecr.us-west-2.amazonaws.com/otel-agents/data-agent:a45a406"
    port: 8080
    capabilities:
      memory: false
      browser: false
      codeInterpreter: false
