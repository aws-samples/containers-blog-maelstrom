##########################################################################
# Langfuse v3 — Full stack: Web + Worker + Postgres + ClickHouse + Redis + MinIO
# Adapted from: sample-agent-platform-on-eks/gitops/addons/charts/langfuse
##########################################################################

# ─── ConfigMap (non-secret configuration) ─────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: observability
data:
  NEXTAUTH_URL: "http://langfuse.observability:3000"
  TELEMETRY_ENABLED: "false"
  NODE_ENV: "production"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: "redis://langfuse-redis:6379"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  # OTEL ingestion + headless init (non-secret metadata only)
  LANGFUSE_ENABLE_OTEL_INGESTION: "true"
  LANGFUSE_INIT_ORG_ID: "seed-org-agent-obs"
  LANGFUSE_INIT_ORG_NAME: "Agent Observability"
  LANGFUSE_INIT_PROJECT_ID: "seed-project-agent-obs"
  LANGFUSE_INIT_PROJECT_NAME: "agent-observability"
  LANGFUSE_INIT_USER_EMAIL: "admin@agent-observability.local"
  LANGFUSE_INIT_USER_NAME: "Admin"
  # NOTE: All credentials are intentionally NOT stored here. They are
  # generated at deploy time by scripts/setup-infra.sh and injected into
  # the Secrets below (langfuse-secrets, langfuse-init-keys, langfuse-api-keys).
  # ArgoCD ignores the `data` field of these Secrets (see the langfuse
  # Application's ignoreDifferences) so self-heal never reverts them to
  # placeholders. The secret-holding env vars that used to live in this
  # ConfigMap (LANGFUSE_INIT_PROJECT_PUBLIC_KEY/SECRET_KEY,
  # LANGFUSE_INIT_USER_PASSWORD) now come from the langfuse-init-keys Secret.
---
# ─── Secrets (credentials) ────────────────────────────────────────────────
# These Secrets are created with PLACEHOLDER values here so ArgoCD can create
# the objects and pods can mount them. Real random values are written by
# scripts/setup-infra.sh at deploy time. ArgoCD's ignoreDifferences on Secret
# `data` prevents self-heal from overwriting the generated values.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: observability
  annotations:
    # Marks these as bootstrap placeholders — setup-infra.sh replaces them.
    agent-obs/credentials: "generated-at-deploy-time"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://langfuse:PLACEHOLDER@langfuse-postgres:5432/langfuse"
  POSTGRES_PASSWORD: "PLACEHOLDER"
  NEXTAUTH_SECRET: "PLACEHOLDER"
  SALT: "PLACEHOLDER"
  CLICKHOUSE_PASSWORD: "PLACEHOLDER"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "PLACEHOLDER"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "PLACEHOLDER"
  MINIO_ROOT_USER: "PLACEHOLDER"
  MINIO_ROOT_PASSWORD: "PLACEHOLDER"
---
# ─── Langfuse headless-init project keys (seed the auto-created project) ──
# Consumed by the langfuse-web pod as LANGFUSE_INIT_PROJECT_PUBLIC_KEY /
# _SECRET_KEY. Generated at deploy time; must match langfuse-api-keys.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-init-keys
  namespace: observability
  annotations:
    agent-obs/credentials: "generated-at-deploy-time"
type: Opaque
stringData:
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "PLACEHOLDER"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "PLACEHOLDER"
  LANGFUSE_INIT_USER_PASSWORD: "PLACEHOLDER"
---
# ─── Langfuse API keys secret (consumed by agents + OTEL Collector) ───────
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: observability
  annotations:
    agent-obs/credentials: "generated-at-deploy-time"
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "PLACEHOLDER"
  LANGFUSE_SECRET_KEY: "PLACEHOLDER"
  LANGFUSE_AUTH_TOKEN: "PLACEHOLDER"
---
# ─── Langfuse Web Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
        app.kubernetes.io/name: langfuse
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z langfuse-postgres 5432; do sleep 2; done']
      containers:
        - name: langfuse
          image: langfuse/langfuse:3
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
            - secretRef:
                name: langfuse-init-keys
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              # Keep the memory limit within a single node's capacity (nodes are
              # ~4Gi). A limit larger than the node is meaningless and a limit
              # equal to it risks node-level memory pressure.
              cpu: "2"
              memory: 3Gi
          # Langfuse's /api/public/health pings Postgres, ClickHouse and Redis and
          # can take several seconds. The default probe timeout is 1s, which caused
          # the container to be repeatedly killed ("context deadline exceeded") even
          # while healthy. Give the probes generous timeouts and liveness slack.
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: observability
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
---
# ─── Langfuse Worker ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        app.kubernetes.io/name: langfuse
    spec:
      containers:
        - name: worker
          image: langfuse/langfuse-worker:3
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# ─── PostgreSQL ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ─── ClickHouse ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: observability
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: observability
spec:
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
# ─── Redis ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: observability
spec:
  selector:
    app: langfuse-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ─── MinIO (S3-compatible blob storage) ───────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-minio
  namespace: observability
spec:
  serviceName: langfuse-minio
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  namespace: observability
spec:
  selector:
    app: langfuse-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# ─── MinIO bucket init job ────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-minio-init
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              mc alias set local http://langfuse-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/langfuse
              echo "Bucket langfuse ready"
