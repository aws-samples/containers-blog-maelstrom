##########################################################################
# Langfuse v3 — Full stack: Web + Worker + Postgres + ClickHouse + Redis + MinIO
# Adapted from: sample-agent-platform-on-eks/gitops/addons/charts/langfuse
##########################################################################

# ─── ConfigMap (non-secret configuration) ─────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: observability
data:
  NEXTAUTH_URL: "http://langfuse.observability:3000"
  TELEMETRY_ENABLED: "false"
  NODE_ENV: "production"
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: "redis://langfuse-redis:6379"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  # OTEL ingestion + headless init
  LANGFUSE_ENABLE_OTEL_INGESTION: "true"
  LANGFUSE_INIT_ORG_ID: "seed-org-agent-obs"
  LANGFUSE_INIT_ORG_NAME: "Agent Observability"
  LANGFUSE_INIT_PROJECT_ID: "seed-project-agent-obs"
  LANGFUSE_INIT_PROJECT_NAME: "agent-observability"
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-agent-obs-seed"
  LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-agent-obs-seed"
  LANGFUSE_INIT_USER_EMAIL: "admin@agent-observability.local"
  LANGFUSE_INIT_USER_NAME: "Admin"
  LANGFUSE_INIT_USER_PASSWORD: "AgentObs2026!"
---
# ─── Secret (credentials) ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: observability
type: Opaque
stringData:
  DATABASE_URL: "postgresql://langfuse:langfuse-demo-pw@langfuse-postgres:5432/langfuse"
  POSTGRES_PASSWORD: "langfuse-demo-pw"
  NEXTAUTH_SECRET: "otel-agent-obs-nextauth-secret-2026"
  SALT: "otel-agent-obs-salt-2026"
  CLICKHOUSE_PASSWORD: "clickhouse-demo-pw"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "minio"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "miniosecret"
  MINIO_ROOT_PASSWORD: "miniosecret"
---
# ─── Langfuse API keys secret (consumed by agents + OTEL Collector) ───────
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: observability
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "pk-lf-agent-obs-seed"
  LANGFUSE_SECRET_KEY: "sk-lf-agent-obs-seed"
  LANGFUSE_AUTH_TOKEN: "cGstbGYtYWdlbnQtb2JzLXNlZWQ6c2stbGYtYWdlbnQtb2JzLXNlZWQ="
---
# ─── Langfuse Web Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
        app.kubernetes.io/name: langfuse
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z langfuse-postgres 5432; do sleep 2; done']
      containers:
        - name: langfuse
          image: langfuse/langfuse:3
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          # Langfuse's /api/public/health pings Postgres, ClickHouse and Redis and
          # can take several seconds. The default probe timeout is 1s, which caused
          # the container to be repeatedly killed ("context deadline exceeded") even
          # while healthy. Give the probes generous timeouts and liveness slack.
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: observability
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
---
# ─── Langfuse Worker ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
        app.kubernetes.io/name: langfuse
    spec:
      containers:
        - name: worker
          image: langfuse/langfuse-worker:3
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# ─── PostgreSQL ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  serviceName: langfuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              value: "langfuse-demo-pw"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: observability
spec:
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# ─── ClickHouse ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: observability
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: "clickhouse-demo-pw"
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: observability
spec:
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
# ─── Redis ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: observability
spec:
  selector:
    app: langfuse-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ─── MinIO (S3-compatible blob storage) ───────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-minio
  namespace: observability
spec:
  serviceName: langfuse-minio
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "minio"
            - name: MINIO_ROOT_PASSWORD
              value: "miniosecret"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  namespace: observability
spec:
  selector:
    app: langfuse-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# ─── MinIO bucket init job ────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-minio-init
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set local http://langfuse-minio:9000 minio miniosecret
              mc mb --ignore-existing local/langfuse
              echo "Bucket langfuse ready"
