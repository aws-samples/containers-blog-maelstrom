# Langfuse API credentials used by:
#   - Agent pods (both patterns): authenticate OTLP traces sent directly to Langfuse
#   - OTEL Collector (Pattern 2): authenticate forwarded traces to Langfuse
#
# After Langfuse first boots, generate real credentials:
#   1. Port-forward: kubectl port-forward svc/langfuse-web -n observability 3000:3000
#   2. Open http://localhost:3000 — create an account and a project
#   3. In project Settings → API Keys, generate a Public Key and Secret Key
#   4. Apply the secret with real values:
#      kubectl create secret generic langfuse-api-keys -n observability \
#        --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
#        --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
#        --from-literal=LANGFUSE_AUTH_TOKEN=$(echo -n "pk-lf-...:sk-lf-..." | base64) \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# LANGFUSE_AUTH_TOKEN is used by the OTEL Collector's Authorization header.
# Until real keys are set, the Collector and agents will receive HTTP 401 from Langfuse.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: observability
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "pk-lf-REPLACE-ME"
  LANGFUSE_SECRET_KEY: "sk-lf-REPLACE-ME"
  LANGFUSE_AUTH_TOKEN: "REPLACE-ME-base64-pubkey-colon-secretkey"
