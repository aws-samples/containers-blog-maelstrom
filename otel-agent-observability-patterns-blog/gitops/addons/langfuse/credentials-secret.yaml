# Langfuse API credentials for OTEL Collector authentication.
#
# IMPORTANT: After Langfuse first boots, create real credentials:
#   1. Open Langfuse UI: kubectl port-forward svc/langfuse -n observability 3000:3000
#   2. Create a project and generate API keys
#   3. Update this Secret with real values:
#      kubectl create secret generic langfuse-api-keys -n observability \
#        --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
#        --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# Until real keys are set, the OTEL Collector will send traces to Langfuse
# but they will be rejected with HTTP 401 (visible in Collector logs).
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: observability
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "pk-lf-REPLACE-ME"
  LANGFUSE_SECRET_KEY: "sk-lf-REPLACE-ME"
