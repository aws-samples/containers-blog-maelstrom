# Langfuse API keys in the agents namespace — consumed by agent pods
# for OTLP authentication when sending traces directly to Langfuse (Pattern 1).
#
# Values here are PLACEHOLDERS. Real random keys are generated at deploy time
# by scripts/setup-infra.sh and must match the langfuse-api-keys Secret in the
# observability namespace and the project keys Langfuse is seeded with.
# ArgoCD ignores this Secret's `data` field so self-heal never reverts the
# generated values back to these placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: agents
  annotations:
    agent-obs/credentials: "generated-at-deploy-time"
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "PLACEHOLDER"
  LANGFUSE_SECRET_KEY: "PLACEHOLDER"
  LANGFUSE_AUTH_TOKEN: "PLACEHOLDER"
