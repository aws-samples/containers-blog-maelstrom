apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agentcore-browser
spec:
  schema:
    apiVersion: kro.run/v1alpha1
    kind: AgentCoreBrowser
    spec:
      name:
        type: string
      namespace:
        type: string
  resources:
    - id: browser
      apiVersion: bedrockagentcorecontrol.services.k8s.aws/v1alpha1
      kind: Browser
      metadata:
        name: ${schema.spec.name}
        namespace: ${schema.spec.namespace}
      spec:
        name: ${schema.spec.name}
    - id: secret
      apiVersion: v1
      kind: Secret
      metadata:
        name: "${schema.spec.name}-browser-outputs"
        namespace: ${schema.spec.namespace}
      stringData:
        id: ${browser.status.id}
