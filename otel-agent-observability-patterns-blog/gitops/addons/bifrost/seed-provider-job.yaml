# One-shot Job that seeds the Bedrock provider into Bifrost's config store.
# Runs after Bifrost is available and idempotently creates the provider.
apiVersion: batch/v1
kind: Job
metadata:
  name: bifrost-seed-provider
  namespace: agents
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Bifrost to be ready..."
              until curl -sf http://bifrost.agents:8080/api/providers > /dev/null 2>&1; do
                sleep 5
              done
              echo "Bifrost is ready. Seeding config..."

              # Seed Bedrock provider
              curl -s -X POST http://bifrost.agents:8080/api/providers \
                -H "Content-Type: application/json" \
                -d '{"name":"bedrock-default","provider":"bedrock","config":{"region":"us-west-2"}}'
              echo ""

              # Seed IAM key for Bedrock (Pod Identity handles actual auth)
              curl -s -X POST http://bifrost.agents:8080/api/providers/bedrock/keys \
                -H "Content-Type: application/json" \
                -d '{"name":"iam-default","key":"pod-identity","models":["*"]}'
              echo ""

              # Disable VK requirement via governance plugin
              curl -s -X POST http://bifrost.agents:8080/api/plugins \
                -H "Content-Type: application/json" \
                -d '{"name":"governance","enabled":true,"version":1,"config":{"is_vk_mandatory":false}}'
              echo ""

              echo "Bifrost seeding complete."
