# One-shot Job that seeds the Bedrock provider and OTEL plugin into Bifrost.
# Runs after Bifrost is available and idempotently configures:
#   1. Bedrock provider with Pod Identity auth
#   2. OTEL plugin pointing at the configured target (Langfuse or Collector)
apiVersion: batch/v1
kind: Job
metadata:
  name: bifrost-seed-provider
  namespace: agents
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: curlimages/curl:8.5.0
          envFrom:
            - secretRef:
                name: langfuse-api-keys
          env:
            - name: BIFROST_HOST
              value: "http://bifrost.agents:8080"
            - name: AWS_REGION
              value: "us-west-2"
            # OTEL target — matches gitops/root/values.yaml bifrost.otelTarget.
            # Bifrost uses this URL verbatim (no OTLP signal-path appending), so
            # the Langfuse traces path /v1/traces MUST be included or exports 404.
            # Pattern 1: http://langfuse-web.observability:3000/api/public/otel/v1/traces
            # Pattern 2: otel-collector-opentelemetry-collector.observability:4317 (gRPC, no path)
            - name: OTEL_TARGET
              value: "http://langfuse-web.observability:3000/api/public/otel/v1/traces"
            - name: OTEL_PROTOCOL
              value: "http"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Bifrost to be ready..."
              until curl -sf "$BIFROST_HOST/api/providers" > /dev/null 2>&1; do
                sleep 5
              done
              echo "Bifrost is ready. Seeding config..."

              # 1. Seed Bedrock provider
              curl -sf -X POST "$BIFROST_HOST/api/providers" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"bedrock-default\",\"provider\":\"bedrock\",\"config\":{\"region\":\"$AWS_REGION\"}}"
              echo ""

              # 2. Seed IAM key for Bedrock (Pod Identity handles actual auth)
              curl -sf -X POST "$BIFROST_HOST/api/providers/bedrock/keys" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"iam-default\",\"key\":\"pod-identity\",\"models\":[\"*\"],\"bedrock_key_config\":{\"region\":\"$AWS_REGION\"}}"
              echo ""

              # 3. Configure OTEL plugin — sends correlated LLM spans to target
              # Build auth header for Langfuse (used when OTEL_TARGET is Langfuse directly)
              AUTH_HEADER=""
              if [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ]; then
                AUTH_HEADER=$(echo -n "$LANGFUSE_PUBLIC_KEY:$LANGFUSE_SECRET_KEY" | base64)
              fi

              # Delete any pre-existing otel plugin first (the Bifrost Helm chart
              # may create one at install with a stale collector_url). POST alone
              # returns 409 if it exists, silently keeping the wrong URL. Deleting
              # first makes this seed config authoritative.
              curl -s -X DELETE "$BIFROST_HOST/api/plugins/otel" > /dev/null 2>&1 || true
              curl -sf -X POST "$BIFROST_HOST/api/plugins" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"otel\",
                  \"enabled\": true,
                  \"version\": 1,
                  \"config\": {
                    \"service_name\": \"bifrost\",
                    \"collector_url\": \"$OTEL_TARGET\",
                    \"trace_type\": \"genai_extension\",
                    \"protocol\": \"$OTEL_PROTOCOL\",
                    \"insecure\": true,
                    \"headers\": {
                      \"Authorization\": \"Basic $AUTH_HEADER\"
                    }
                  }
                }"
              echo ""

              # 4. Ensure the governance plugin is NOT enabled.
              # On Bifrost v1.6.x the governance plugin enforces a virtual key on
              # every inference call, which breaks the agents. Delete it if a
              # previous run (or persisted PVC state) left it enabled.
              curl -s -X DELETE "$BIFROST_HOST/api/plugins/governance" > /dev/null 2>&1 || true
              echo "Governance plugin disabled."

              # 5. Disable virtual-key enforcement on inference.
              # This is the real control. Bifrost persists client_config to its PVC
              # and boots with enforce_auth_on_inference=true, ignoring the Helm
              # chart's config.enforceAuthOnInference value. Without this the agents
              # fail every call with HTTP 401 virtual_key_required (survives pod
              # restarts because the PVC keeps the flag true).
              # Read the current config, flip the flag, and PUT it back. The API
              # accepts the full config object. Pure curl+sed — this container
              # (curlimages/curl) has no python or jq.
              CFG=$(curl -sf "$BIFROST_HOST/api/config")
              if [ -n "$CFG" ]; then
                printf '%s' "$CFG" \
                  | sed 's/"enforce_auth_on_inference":[[:space:]]*true/"enforce_auth_on_inference":false/' \
                  | curl -s -X PUT "$BIFROST_HOST/api/config" \
                      -H "Content-Type: application/json" -d @- > /dev/null 2>&1 || true
                echo "Virtual-key enforcement disabled (enforce_auth_on_inference=false)."
              fi

              echo "Bifrost seeding complete."
