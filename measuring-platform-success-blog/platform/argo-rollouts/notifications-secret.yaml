# Secret holding the DevLake webhook URL that the notifications ConfigMap
# references as $devlake-webhook-url.
#
# IMPORTANT: use the in-cluster DevLake service DNS name here, NOT localhost.
# The Argo Rollouts controller runs inside the cluster, so it must reach DevLake
# over the cluster network.
#
# The /api/rest prefix is served by the config-ui proxy (port 4000), so use:
#
#   http://devlake-config-ui.devlake.svc.cluster.local:4000/api/rest/plugins/webhook/connections/<ID>/deployments
#
# (If you post to the lake backend directly on :8080, drop the /api/rest prefix —
# the backend serves routes at the root.)
#
# Replace <ID> with the connection id from script 52 / the DevLake config UI
# (section 7 of the README).
#
# The setup script scripts/60-configure-rollout-notifications.sh will substitute
# the value for you from the DEVLAKE_WEBHOOK_URL env var; this file is the
# template / manual fallback.
apiVersion: v1
kind: Secret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
type: Opaque
stringData:
  devlake-webhook-url: "http://devlake-config-ui.devlake.svc.cluster.local:4000/api/rest/plugins/webhook/connections/1/deployments"
