# Secret holding the DevLake webhook URL + API token that the notifications
# ConfigMap references as $devlake-webhook-url and $devlake-webhook-token.
#
# IMPORTANT: use the in-cluster DevLake service DNS name here, NOT localhost.
# The Argo Rollouts controller runs inside the cluster, so it must reach DevLake
# over the cluster network. The config-ui service is named "devlake-ui".
#
# The /api/rest prefix is served by the config-ui proxy (port 4000), so use:
#
#   http://devlake-ui.devlake.svc.cluster.local:4000/api/rest/plugins/webhook/connections/<ID>/deployments
#
# (If you post to the lake backend directly on :8080, drop the /api/rest prefix —
# the backend serves routes at the root.)
#
# Replace <ID> with the connection id from script 52 / the DevLake config UI.
#
# devlake-webhook-token is the connection's API key (script 52 stores it as
# DEVLAKE_TOKEN in the devlake-webhook-secret in the argo namespace). The webhook
# rejects POSTs without "Authorization: Bearer <token>" (HTTP 401 token missing).
#
# scripts/60-configure-rollout-notifications.sh substitutes both values for you
# (URL from DEVLAKE_WEBHOOK_URL, token pulled from the argo-namespace secret);
# this file is the template / manual fallback.
apiVersion: v1
kind: Secret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
type: Opaque
stringData:
  devlake-webhook-url: "http://devlake-ui.devlake.svc.cluster.local:4000/api/rest/plugins/webhook/connections/1/deployments"
  devlake-webhook-token: "REPLACE_WITH_CONNECTION_API_KEY"
